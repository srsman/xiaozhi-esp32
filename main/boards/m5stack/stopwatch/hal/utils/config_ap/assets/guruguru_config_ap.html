<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>M5Guruguru Avatar Manager</title>
  <style>
    :root {
      --bg: #0e0e18;
      --card-bg: rgba(27, 23, 43, 0.95);
      --primary: #ff69b4;
      --primary-hover: #ff8ec7;
      --accent: #00f0ff;
      --text: #ffffff;
      --muted: #a0a0b8;
      --border: #382a52;
      --slot-bg: #141122;
      --success: #28ca42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: min(100%, 560px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .info-bar {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .slot {
      background: var(--slot-bg);
      border: 2px dashed var(--border);
      border-radius: 16px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .slot:hover, .slot.dragover {
      border-color: var(--primary);
      background: rgba(255, 105, 180, 0.08);
      transform: scale(1.02);
    }
    .slot.has-image {
      border-style: solid;
      border-color: rgba(255, 105, 180, 0.5);
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .slot.has-image img {
      display: block;
    }
    .slot .dir-indicator {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .slot.has-image .dir-indicator {
      display: none;
    }
    .slot .label {
      position: absolute;
      bottom: 6px;
      font-size: 11px;
      color: #ccc;
      background: rgba(0,0,0,0.65);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-danger {
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.4);
      color: #ff6b6b;
    }
    .btn-danger:hover {
      background: rgba(255, 60, 60, 0.25);
    }
    .btn-exit {
      background: #2a2638;
      color: #e0e0e0;
      border: 1px solid #443c5a;
    }
    .btn-exit:hover {
      background: #39334e;
    }
    .progress-bar-wrap {
      height: 8px;
      background: #232034;
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0 6px;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.2s ease;
    }
    .status-text {
      text-align: center;
      font-size: 13px;
      color: var(--accent);
      min-height: 20px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GURUGURU AVATAR</h1>
    <div class="subtitle" id="t-subtitle">9方向互动切片管理 (M5Stack Stopwatch)</div>

    <div class="info-bar">
      <span>WiFi: <b id="ap-name">M5StopWatch-Guru</b></span>
      <span>IP: <b>192.168.4.1</b></span>
    </div>

    <div class="section-title">
      <span>① 基础9方向动作切片 (必选)</span>
    </div>
    <div class="grid" id="grid-open"></div>
    <div class="actions">
      <button class="btn-primary" id="btn-upload-open" onclick="uploadGroup(false)">上传9方向切片</button>
    </div>
    <div class="progress-bar-wrap" id="prog-wrap-open"><div class="progress-bar" id="prog-open"></div></div>
    <div class="status-text" id="status-open"></div>

    <div class="section-title" style="margin-top:28px;">
      <span>② 闭眼眨眼切片 (可选)</span>
    </div>
    <div class="grid" id="grid-close"></div>
    <div class="actions">
      <button class="btn-primary" id="btn-upload-close" onclick="uploadGroup(true)">上传眨眼切片</button>
    </div>
    <div class="progress-bar-wrap" id="prog-wrap-close"><div class="progress-bar" id="prog-close"></div></div>
    <div class="status-text" id="status-close"></div>

    <div class="actions" style="margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);">
      <button class="btn-danger" onclick="clearAllSlices()">清空恢复默认猫咪</button>
      <button class="btn-exit" onclick="finishAndExit()">完成并返回手表</button>
    </div>
  </div>

  <script>
    const DIRS = [
      { id: 0, arrow: '↖', name: '左上' },
      { id: 1, arrow: '↑', name: '正上' },
      { id: 2, arrow: '↗', name: '右上' },
      { id: 3, arrow: '←', name: '正左' },
      { id: 4, arrow: '⊙', name: '正中' },
      { id: 5, arrow: '→', name: '正右' },
      { id: 6, arrow: '↙', name: '左下' },
      { id: 7, arrow: '↓', name: '正下' },
      { id: 8, arrow: '↘', name: '右下' }
    ];

    const stagedFiles = { open: {}, close: {} };

    function initGrids() {
      renderGrid('grid-open', false);
      renderGrid('grid-close', true);
      loadRemoteState();
    }

    function renderGrid(containerId, isClose) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const groupKey = isClose ? 'close' : 'open';

      DIRS.forEach(d => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${groupKey}-${d.id}`;
        const fileName = `dir${d.id}${isClose ? '_close' : ''}.png`;

        slot.innerHTML = `
          <div class="dir-indicator">${d.arrow}</div>
          <img id="img-${groupKey}-${d.id}" src="" alt="">
          <div class="label">${d.arrow} ${d.name}</div>
        `;

        slot.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/png,image/jpeg';
          input.onchange = (e) => {
            if (e.target.files && e.target.files[0]) {
              handleSelectedFile(groupKey, d.id, e.target.files[0]);
            }
          };
          input.click();
        });

        slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('dragover'); });
        slot.addEventListener('dragleave', () => slot.classList.remove('dragover'));
        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          slot.classList.remove('dragover');
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleSelectedFile(groupKey, d.id, e.dataTransfer.files[0]);
          }
        });

        container.appendChild(slot);
      });
    }

    function handleSelectedFile(groupKey, id, file) {
      stagedFiles[groupKey][id] = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.getElementById(`img-${groupKey}-${id}`);
        const slot = document.getElementById(`slot-${groupKey}-${id}`);
        img.src = e.target.result;
        slot.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    }

    async function loadRemoteState() {
      try {
        const res = await fetch('/guruguru/state');
        if (!res.ok) return;
        const state = await res.json();
        if (state.apSsid) {
          document.getElementById('ap-name').textContent = state.apSsid;
        }
        if (state.slices) {
          DIRS.forEach(d => {
            const openName = `dir${d.id}.png`;
            if (state.slices[openName]) {
              const img = document.getElementById(`img-open-${d.id}`);
              img.src = `/guruguru/image?name=${openName}&_t=${Date.now()}`;
              document.getElementById(`slot-open-${d.id}`).classList.add('has-image');
            }
            const closeName = `dir${d.id}_close.png`;
            if (state.slices[closeName]) {
              const img = document.getElementById(`img-close-${d.id}`);
              img.src = `/guruguru/image?name=${closeName}&_t=${Date.now()}`;
              document.getElementById(`slot-close-${d.id}`).classList.add('has-image');
            }
          });
        }
      } catch (e) {
        console.warn('Load state failed:', e);
      }
    }

    async function uploadGroup(isClose) {
      const groupKey = isClose ? 'close' : 'open';
      const staged = stagedFiles[groupKey];
      const keys = Object.keys(staged);
      const progWrap = document.getElementById(`prog-wrap-${groupKey}`);
      const prog = document.getElementById(`prog-${groupKey}`);
      const status = document.getElementById(`status-${groupKey}`);
      const btn = document.getElementById(`btn-upload-${groupKey}`);

      if (keys.length === 0) {
        status.textContent = '请先点击格子选择需要上传的切片文件';
        return;
      }

      progWrap.style.display = 'block';
      prog.style.width = '0%';
      btn.disabled = true;

      let successCount = 0;
      for (let i = 0; i < keys.length; i++) {
        const id = keys[i];
        const file = staged[id];
        const fileName = `dir${id}${isClose ? '_close' : ''}.png`;
        status.textContent = `正在上传 ${fileName} (${i + 1}/${keys.length})...`;

        try {
          const res = await fetch(`/upload?filename=${encodeURIComponent(fileName)}`, {
            method: 'POST',
            headers: {
              'Content-Type': file.type || 'image/png',
              'X-File-Name': fileName
            },
            body: file
          });
          if (res.ok) successCount++;
        } catch (err) {
          console.error('Upload error:', err);
        }
        prog.style.width = `${Math.round(((i + 1) / keys.length) * 100)}%`;
      }

      status.textContent = `✅ 成功上传 ${successCount} 个切片！`;
      btn.disabled = false;
      stagedFiles[groupKey] = {};
    }

    async function clearAllSlices() {
      if (!confirm('确定清空所有自定义切片并恢复默认猫咪吗？')) return;
      try {
        const res = await fetch('/guruguru/clear', { method: 'POST' });
        if (res.ok) {
          alert('已清空所有切片，重新进入将显示默认猫咪！');
          location.reload();
        }
      } catch (e) {
        alert('清空失败');
      }
    }

    async function finishAndExit() {
      try {
        await fetch('/exit', { method: 'POST' });
      } catch (e) {}
      alert('已请求退出配网模式，手表即将切回头像显示！');
    }

    window.onload = initGrids;
  </script>
</body>
</html>
